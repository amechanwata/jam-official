html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.outside{position:fixed;left:24px;bottom:22px;font-size:11px;letter-spacing:.14em;color:#8a877f;line-height:1.9;max-width:240px}
.outside a{text-decoration:underline}

  .phone{width:100%;height:100svh;border-radius:0;box-shadow:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  grid:'<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>',
  tagged:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19a6 6 0 0 1 11 0"/>',
  plus:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
  x:'<path d="M5 5l14 14M19 5 5 19"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
};
const ic=(n,extra='')=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true" ${extra}>${ICON[n]}</svg>`;
const avatar=(u,size='')=>ACCOUNTS[u]?`<span class="av" style="${size}"><img src="${IMG(ACCOUNTS[u].av)}" alt=""></span>`:`<span class="av fan-av" style="${size}">${esc(u[0].toUpperCase())}</span>`;
function when(d){
  const t=new Date(d+'T12:00:00+09:00'),days=Math.floor((NOW-t)/864e5);
  if(days<1)return '今日';if(days<7)return days+'日前';
  const [y,m,dd]=d.split('-').map(Number);return y===NOW.getFullYear()?`${m}月${dd}日`:`${y}年${m}月${dd}日`;
}
const byDate=(a,b)=>b[3].localeCompare(a[3]);
const P=id=>POSTS.find(p=>p[0]===id);
const state={tab:'home',profile:'rin_jam',ptab:'grid',open:null,liked:new Set(),saved:new Set(),seen:new Set(),cliked:new Set(),hist:[]};

/* ---------------- views ---------------- */
function postHTML(p){
  const [id,u,img,date,likes,cap,cms]=p,on=state.liked.has(id),n=cms.reduce((a,c)=>a+1+(c[2]||[]).length,0);
  const st=STORIES[u],ring=st?`<span class="ring${state.seen.has(u)?' seen':''}" data-story="${u}">${avatar(u,'width:32px;height:32px')}</span>`:avatar(u,'width:32px;height:32px');
  return `<article class="post" data-id="${id}">
    <div class="ph">${ring}<button class="who" data-prof="${u}"><b>${u}</b><small>${ACCOUNTS[u].name}</small></button><button aria-label="その他">${ic('dots')}</button></div>
    <div class="img" data-dbl="${id}"><img src="${IMG(img)}" alt="" loading="lazy"><svg class="burst" viewBox="0 0 24 24" aria-hidden="true">${ICON.heart}</svg></div>
    <div class="bar"><button class="like${on?' on':''}" data-like="${id}" aria-label="いいね" aria-pressed="${on}">${ic('heart')}</button><button data-cm="${id}" aria-label="コメント">${ic('comment')}</button><button aria-label="シェア">${ic('send')}</button><span class="sp"></span><button class="mark-b${state.saved.has(id)?' on':''}" data-save="${id}" aria-label="保存">${ic('save')}</button></div>
    <div class="likes">「いいね！」${likes}件</div>
    ${cap?`<div class="cap"><b>${u}</b>${rich(cap)}</div>`:''}
    ${n?`<button class="more" data-cm="${id}">コメント${n}件をすべて見る</button>`:''}
    <div class="date">${when(date)}</div>
  </article>`;
}
function home(){
  const order=['rin_jam','hina_jam','momoka_jam'].sort((a,b)=>state.seen.has(a)-state.seen.has(b));
  return `<div class="stories">${order.map(u=>`<button class="st" data-story="${u}"><span class="ring${state.seen.has(u)?' seen':''}">${avatar(u)}</span><span>${u}</span></button>`).join('')}</div>
    ${[...POSTS].sort(byDate).map(postHTML).join('')}`;
}
function explore(){
  const mix=[...POSTS].sort((a,b)=>(a[0].slice(1)+a[0][0]).localeCompare(b[0].slice(1)+b[0][0]));
  return `<div class="search">${ic('search')}検索</div><div class="grid">${mix.map(p=>`<button data-open="${p[0]}" aria-label="投稿を開く"><img src="${IMG(p[2])}" alt="" loading="lazy"></button>`).join('')}</div>`;
}
function profile(u){
  const a=ACCOUNTS[u],mine=POSTS.filter(p=>p[1]===u).sort(byDate);
  const tagged=POSTS.filter(p=>(TAGS[p[0]]||[]).includes(u)).sort(byDate);
  const list=state.ptab==='grid'?mine:tagged;
  return `<div class="pf">
      <div class="pf-row"><span class="ring${state.seen.has(u)?' seen':''}" data-story="${u}">${avatar(u)}</span>
        <div class="cnt"><div><b>${mine.length}</b><span>投稿</span></div><div><b>${a.followers}</b><span>フォロワー</span></div><div><b>${a.following}</b><span>フォロー中</span></div></div></div>
      <h1>${esc(a.name)}</h1><div class="bio">${rich(a.bio)}</div>
      <div class="pf-btns"><button class="btn blue">フォロー</button><button class="btn">メッセージ</button><button class="btn sq" aria-label="おすすめ">${ic('down','style="width:16px;height:16px"')}</button></div>
    </div>
    <div class="hl">${a.hl.map(([t,img])=>`<div><span class="av"><img src="${IMG(img)}" alt=""></span><span>${esc(t)}</span></div>`).join('')}</div>
    <div class="tabs"><button data-ptab="grid" aria-pressed="${state.ptab==='grid'}" aria-label="投稿">${ic('grid')}</button><button data-ptab="tagged" aria-pressed="${state.ptab==='tagged'}" aria-label="タグ付け">${ic('tagged')}</button></div>
    ${list.length?`<div class="grid">${list.map(p=>`<button data-open="${p[0]}" aria-label="投稿を開く"><img src="${IMG(p[2])}" alt="" loading="lazy"></button>`).join('')}</div>`:`<div class="empty">タグ付けされた写真はまだありません</div>`}`;
}
function single(id){return postHTML(P(id))+'<div style="height:30px"></div>'}

function render(keepScroll){
  const v=$('#view'),y=v.scrollTop;
  let top='',body='';
  if(state.open){
    top=`<button data-back aria-label="戻る">${ic('back')}</button><b style="font-size:16px">投稿</b><span style="width:24px"></span>`;
    body=single(state.open);
  }else if(state.tab==='home'){
    top=`<span class="mark">frame.</span><span class="acts"><button aria-label="お知らせ">${ic('heart')}</button><button aria-label="メッセージ">${ic('send')}</button></span>`;
    body=home();
  }else if(state.tab==='explore'){
    top=`<span class="mark">frame.</span><span></span>`;body=explore();
  }else{
    top=`<button class="uname" data-switch>${state.profile}${ic('down')}</button><span class="acts"><button aria-label="作成">${ic('plus')}</button><button aria-label="メニュー">${ic('menu')}</button></span>`;
    body=profile(state.profile);
  }
  $('#top').innerHTML=top;v.innerHTML=body;v.scrollTop=keepScroll?y:0;
  $('#nav').innerHTML=`<button data-tab="home" aria-label="ホーム" aria-current="${state.tab==='home'&&!state.open}">${ic('home')}</button>
    <button data-tab="explore" aria-label="検索" aria-current="${state.tab==='explore'&&!state.open}">${ic('search')}</button>
    <button data-tab="profile" aria-label="プロフィール" aria-current="${state.tab==='profile'&&!state.open}"><span class="me av"><img src="${IMG(ACCOUNTS[state.profile].av)}" alt=""></span></button>`;
}

/* ---------------- sheets ---------------- */
function openSheet(title,html){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheet').classList.add('open');$('#veil').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open');$('#veil').classList.remove('open')}
function comments(id){
  const p=P(id),[,u,,date,,cap,cms]=p;
  const one=(c,k,reply)=>{const key=id+':'+k,on=state.cliked.has(key);
    return `<div class="cm${reply?' reply':''}">${avatar(c[0])}<div><p><b>${esc(c[0])}</b>${rich(c[1])}</p><small>${when(date)}　返信する</small></div><button class="h${on?' on':''}" data-cl="${key}" aria-label="コメントにいいね">${ic('heart')}</button></div>`};
  let html=cap?`<div class="cm" style="border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px">${avatar(u)}<div><p><b>${u}</b>${rich(cap)}</p><small>${when(date)}</small></div><span></span></div>`:'';
  cms.forEach((c,i)=>{html+=one(c,i);(c[2]||[]).forEach((r,j)=>html+=one(r,i+'-'+j,true))});
  openSheet('コメント',html||'<div class="empty">まだコメントはありません</div>');
}
function switcher(){
  openSheet('アカウントを見る',Object.keys(ACCOUNTS).map(u=>`<button class="acc" data-pick="${u}">${avatar(u)}<span><b>${u}</b><br><small style="color:var(--sub)">${esc(ACCOUNTS[u].name)}</small></span><span class="chk${u===state.profile?' on':''}"></span></button>`).join(''));
}

/* ---------------- stories ---------------- */
let sq=null,timer=null,raf=null;
function openStory(u){
  const users=['rin_jam','hina_jam','momoka_jam'];sq={users,ui:users.indexOf(u),i:0};
  $('#story').classList.add('open');showFrame();
}
function showFrame(){
  clearTimeout(timer);cancelAnimationFrame(raf);
  const u=sq.users[sq.ui],list=STORIES[u],f=list[sq.i];state.seen.add(u);
  $('#story').innerHTML=`<div class="sbars">${list.map((_,k)=>`<i><b style="width:${k<sq.i?100:0}%"></b></i>`).join('')}</div>
    <div class="shead">${avatar(u)}<b>${u}</b><small>${f.at}</small><button class="x" data-sclose aria-label="閉じる">${ic('x')}</button></div>
    <div class="sbody" style="background:${f.bg||'#111'}">${f.img?`<img src="${IMG(f.img)}" alt="">`:''}${f.text?`<div class="stext">${rich(f.text)}</div>`:''}${f.plain?`<div class="stext plain">${esc(f.plain)}</div>`:''}
      <button class="tapL" data-sprev aria-label="前へ"></button><button class="tapR" data-snext aria-label="次へ"></button></div>
    <div class="sfoot"><div>メッセージを送信</div>${ic('heart')}${ic('send')}</div>`;
  const bar=$('#story .sbars i:nth-child('+(sq.i+1)+') b'),dur=5000,t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/dur);bar.style.width=k*100+'%';if(k<1)raf=requestAnimationFrame(step);else next()};
  raf=requestAnimationFrame(step);
}
function next(){const list=STORIES[sq.users[sq.ui]];if(sq.i<list.length-1)sq.i++;else if(sq.ui<sq.users.length-1){sq.ui++;sq.i=0}else return closeStory();showFrame()}
function prev(){if(sq.i>0)sq.i--;else if(sq.ui>0){sq.ui--;sq.i=STORIES[sq.users[sq.ui]].length-1}showFrame()}
function closeStory(){cancelAnimationFrame(raf);$('#story').classList.remove('open');sq=null;render(true)}

/* ---------------- events ---------------- */
let lastTap={id:null,t:0};
function like(id,force){
  const was=state.liked.has(id);if(force&&was)return;
  was?state.liked.delete(id):state.liked.add(id);
  document.querySelectorAll(`[data-like="${id}"]`).forEach(b=>{b.classList.toggle('on',!was);b.setAttribute('aria-pressed',!was);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-dbl],[data-story]');if(!t)return;
  const d=t.dataset;
  if(d.sclose!==undefined)return closeStory();
  if(d.snext!==undefined)return next();
  if(d.sprev!==undefined)return prev();
  if(d.story)return openStory(d.story);
  if(d.tab){state.tab=d.tab;state.open=null;if(d.tab==='profile')state.ptab='grid';closeSheet();return render()}
  if(d.prof){state.profile=d.prof;state.tab='profile';state.open=null;state.ptab='grid';return render()}
  if(d.open){state.hist.push(state.tab);state.open=d.open;return render()}
  if(d.back!==undefined){state.open=null;return render()}
  if(d.ptab){state.ptab=d.ptab;return render(true)}
  if(d.switch!==undefined)return switcher();
  if(d.pick){state.profile=d.pick;state.ptab='grid';closeSheet();return render()}
  if(d.like)return like(d.like);
  if(d.save){const on=state.saved.has(d.save);on?state.saved.delete(d.save):state.saved.add(d.save);t.classList.toggle('on',!on);return}
  if(d.cm)return comments(d.cm);
  if(d.cl){const on=state.cliked.has(d.cl);on?state.cliked.delete(d.cl):state.cliked.add(d.cl);t.classList.toggle('on',!on);return}
  if(d.dbl){const now=Date.now();
    if(lastTap.id===d.dbl&&now-lastTap.t<320){like(d.dbl,true);const b=t.querySelector('.burst');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');lastTap={id:null,t:0}}
    else lastTap={id:d.dbl,t:now}}
});
$('#veil').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sq)closeStory();else closeSheet()}
  if(sq&&e.key==='ArrowRight')next();if(sq&&e.key==='ArrowLeft')prev()});
const start=(location.hash||'').slice(1);
if(ACCOUNTS[start]){state.tab='profile';state.profile=start}
render();
</script>
</body>
</html>
